<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aylin AI Manager</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        .header {
            height: 64px;
            background: #111827;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }

        .header h1 {
            margin: 0;
            font-size: 20px;
        }

        .status {
            font-size: 13px;
            color: #86efac;
        }

        .layout {
            display: grid;
            grid-template-columns: 230px 1fr 330px;
            height: calc(100vh - 64px);
        }

        .sidebar {
            background: white;
            border-right: 1px solid #e5e7eb;
            padding: 20px;
        }

        .sidebar h3 {
            margin-top: 0;
        }

        input,
        button {
            font: inherit;
        }

        .phone-input {
            width: 100%;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            margin-bottom: 10px;
        }

        button {
            border: 0;
            border-radius: 7px;
            padding: 10px 14px;
            cursor: pointer;
        }

        .new-btn {
            width: 100%;
            background: #111827;
            color: white;
        }

        .chat {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .chat-header {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 16px 20px;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
        }

        .message {
            max-width: 75%;
            padding: 12px 15px;
            margin-bottom: 14px;
            border-radius: 12px;
            line-height: 1.45;
            white-space: pre-wrap;
        }

        .customer {
            margin-left: auto;
            background: #dbeafe;
        }

        .aylin {
            margin-right: auto;
            background: white;
            border: 1px solid #e5e7eb;
        }

        .composer {
            background: white;
            border-top: 1px solid #e5e7eb;
            padding: 15px;
            display: flex;
            gap: 10px;
        }

        .composer input {
            flex: 1;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
        }

        .send-btn {
            background: #111827;
            color: white;
        }

        .card {
            background: white;
            border-left: 1px solid #e5e7eb;
            padding: 20px;
            overflow-y: auto;
        }

        .card h2 {
            margin-top: 0;
        }

        .field {
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .label {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 3px;
        }

        .value {
            font-weight: 600;
        }

        .empty {
            color: #9ca3af;
            font-weight: normal;
        }

        .stage {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            background: #e0e7ff;
            font-size: 12px;
        }

        .error {
            color: #dc2626;
            margin-top: 10px;
            font-size: 13px;
        }

        @media (max-width: 1000px) {
            .layout {
                grid-template-columns: 200px 1fr;
            }

            .card {
                display: none;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <h1>Aylin AI Manager</h1>
    <div class="status">● System Online</div>
</header>

<div class="layout">

    <aside class="sidebar">
        <h3>Client</h3>

        <input
            id="phone"
            class="phone-input"
            placeholder="Phone number"
        >

        <button
            class="new-btn"
            onclick="openClient()"
        >
            Open Client
        </button>

        <button
            class="new-btn"
            onclick="newApplication()"
            style="margin-top: 8px;"
        >
            + New Application
        </button>

        <div id="error" class="error"></div>
    </aside>


    <main class="chat">

        <div class="chat-header">
            <strong id="chatTitle">
                No client selected
            </strong>
        </div>

        <div id="messages" class="messages">
        </div>

        <div class="composer">

            <input
                id="messageInput"
                placeholder="Type customer message..."
                onkeydown="handleKey(event)"
            >

            <button
                class="send-btn"
                onclick="sendMessage()"
            >
                Send
            </button>

        </div>

    </main>


    <aside class="card">

        <h2>Customer Card</h2>

        <div class="field">
            <div class="label">Application ID</div>
            <div class="value" id="application_id">—</div>
        </div>

        <div class="field">
            <div class="label">Phone</div>
            <div class="value" id="card_phone">—</div>
        </div>

        <div class="field">
            <div class="label">Stage</div>
            <div class="value">
                <span id="stage" class="stage">new</span>
            </div>
        </div>

        <div class="field">
            <div class="label">Car Model</div>
            <div class="value" id="car_model">—</div>
        </div>

        <div class="field">
            <div class="label">Car Year</div>
            <div class="value" id="car_year">—</div>
        </div>

        <div class="field">
            <div class="label">Car Value</div>
            <div class="value" id="car_value">—</div>
        </div>

        <div class="field">
            <div class="label">Loan Amount</div>
            <div class="value" id="loan_amount">—</div>
        </div>

        <div class="field">
            <div class="label">Loan Program</div>
            <div class="value" id="loan_program">—</div>
        </div>

        <div class="field">
            <div class="label">Vehicle Possession</div>
            <div class="value" id="vehicle_possession">—</div>
        </div>

        <div class="field">
            <div class="label">Registration Region</div>
            <div class="value" id="registration_region">—</div>
        </div>

        <div class="field">
            <div class="label">Loan Term</div>
            <div class="value" id="loan_term_months">—</div>
        </div>

        <div class="field">
            <div class="label">Decision</div>
            <div class="value" id="decision">—</div>
        </div>

        <div class="field">
            <div class="label">Next Field</div>
            <div class="value" id="next_field">—</div>
        </div>

    </aside>

</div>


<script>

let currentApplicationId = null;


function setError(message) {
    document.getElementById("error").textContent = message || "";
}


function displayValue(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return "—";
    }

    return value;
}


function updateCard(customer, result = {}) {

    if (!customer) {
        return;
    }

    document.getElementById("application_id").textContent =
        displayValue(customer.application_id);

    document.getElementById("card_phone").textContent =
        displayValue(customer.phone);

    document.getElementById("stage").textContent =
        displayValue(customer.stage);

    document.getElementById("car_model").textContent =
        displayValue(customer.car_model);

    document.getElementById("car_year").textContent =
        displayValue(customer.car_year);

    document.getElementById("car_value").textContent =
        displayValue(customer.car_value);

    document.getElementById("loan_amount").textContent =
        displayValue(customer.loan_amount);

    document.getElementById("loan_program").textContent =
        displayValue(customer.loan_program);

    document.getElementById("vehicle_possession").textContent =
        displayValue(customer.vehicle_possession);

    document.getElementById("registration_region").textContent =
        displayValue(customer.registration_region);

    document.getElementById("loan_term_months").textContent =
        displayValue(customer.loan_term_months);

    document.getElementById("decision").textContent =
        displayValue(customer.decision);

    document.getElementById("next_field").textContent =
        displayValue(result.next_field);

    document.getElementById("chatTitle").textContent =
        customer.phone;

    currentApplicationId =
        customer.application_id;
}


function addMessage(sender, text, save = true) {

    const container =
        document.getElementById("messages");

    const div =
        document.createElement("div");

    div.className =
        "message " +
        (sender === "customer"
            ? "customer"
            : "aylin");

    div.textContent = text;

    container.appendChild(div);

    container.scrollTop =
        container.scrollHeight;

}





async function openClient() {

    const phone =
        document.getElementById("phone").value.trim();

    setError("");

    if (!phone) {
        setError("Enter a phone number first.");
        return;
    }

    try {

        const response =
            await fetch(
                "/applications/current/" +
                encodeURIComponent(phone)
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.detail ||
                "No application found for this client"
            );
        }

        currentApplicationId =
            data.application_id;

        document.getElementById("messages").innerHTML = "";

        updateCard(data);

        document.getElementById("chatTitle").textContent =
            phone;

        await loadChatHistory(currentApplicationId);

    } catch (error) {

        setError(error.message);

    }
}


async function newApplication() {

    const phone =
        document.getElementById("phone").value.trim();

    setError("");

    if (!phone) {
        setError("Enter a phone number first.");
        return;
    }

    try {

        const response =
            await fetch("/applications/new", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    phone: phone
                })
            });

        const contentType =
            response.headers.get("content-type") || "";

        const raw =
            await response.text();

        console.log(
            "Conversation status:",
            response.status
        );

        console.log(
            "Conversation content-type:",
            contentType
        );

        console.log(
            "Conversation response:",
            raw
        );

        if (!contentType.includes("application/json")) {

            throw new Error(
                "Server returned " +
                contentType +
                ": " +
                raw.substring(0, 200)
            );
        }

        let data;

        try {

            data = JSON.parse(raw);

        } catch (error) {

            throw new Error(
                "Invalid JSON response from server"
            );
        }

        if (!response.ok) {
            throw new Error(
                data.detail || "Failed to create application"
            );
        }

        currentApplicationId =
            data.application_id;

        document.getElementById("messages").innerHTML = "";

        document.getElementById("chatTitle").textContent =
            phone;

        await loadCard(phone);

        await loadChatHistory(currentApplicationId);

    } catch (error) {

        setError(error.message);

    }
}


async function loadCard(phone) {

    try {

        const response =
            await fetch(
                "/applications/current/" +
                encodeURIComponent(phone)
            );

        if (!response.ok) {
            return;
        }

        const customer =
            await response.json();

        updateCard(customer);

        currentApplicationId =
            customer.application_id;

    } catch (error) {

        console.error(error);

    }
}


async function sendMessage() {

    const phone =
        document.getElementById("phone").value.trim();

    const input =
        document.getElementById("messageInput");

    const message =
        input.value.trim();

    setError("");

    if (!phone) {
        setError("Enter a phone number first.");
        return;
    }

    if (!message) {
        return;
    }

    addMessage("customer", message);

    input.value = "";

    try {

        const response =
            await fetch("/conversation/message", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    phone: phone,

                    message: message,

                    application_id:
                        currentApplicationId

                })
            });

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(
                data.detail ||
                "Conversation request failed"
            );
        }

        if (data.response) {
            addMessage(
                "aylin",
                data.response
            );
        }

        updateCard(
            data.customer,
            data
        );

        currentApplicationId =
            data.application_id;

    } catch (error) {

        setError(error.message);

    }
}


async function loadChatHistory(phone) {

    const container =
        document.getElementById("messages");

    container.innerHTML = "";

    if (!phone || !currentApplicationId) {
        return;
    }

    try {

        const response =
            await fetch(
                "/dashboard/conversation/" +
                encodeURIComponent(currentApplicationId)
            );

        if (!response.ok) {

            throw new Error(
                "Failed to load conversation history"
            );
        }

        const history =
            await response.json();

        for (const item of history) {

            addMessage(
                item.sender,
                item.message,
                false
            );
        }

    } catch (error) {

        console.error(
            "Conversation history error:",
            error
        );

        setError(
            "Failed to load conversation history"
        );
    }
}


function handleKey(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

}

</script>

</body>
</html>
